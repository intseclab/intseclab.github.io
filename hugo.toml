# intseclab.org 301s here and stays the email domain. Split is intentional.
baseURL = "https://intelligencesecuritylaboratories.org/"
# `locale`, not `languageCode`: the latter was deprecated in Hugo v0.158.0 and
# emits a WARN, which the "site builds cleanly" check treats as a failure.
locale = "en-us"
title = "Intelligence Security Laboratories"
enableRobotsTXT = true
enableEmoji = false

# A brochure site has no tags or categories; without this Hugo publishes
# empty /tags/ and /categories/ pages.
disableKinds = ["taxonomy", "term"]

# ─────────────────────────────────────────────────────────────────────────
#  EDIT BELOW THIS LINE. Everything above is plumbing.
#  See README.md for a plain-English guide.
# ─────────────────────────────────────────────────────────────────────────
[params]
  headline     = "Building secure infrastructure for transformative AI"
  tagline      = "We are a nonprofit research lab focused on implementation-driven R&D for high-security AI systems. Our work bridges the gap between theoretical security requirements and practical deployments."
  contactEmail = "hello@intseclab.org"
  talentEmail  = "talent@intseclab.org"
  footerLine1  = "501(c)(3) Nonprofit Organization"
  footerLine2  = "EIN 39-2886672"

  ashbyOrg     = "Intelligence-Security-Laboratories"

  # Matches --ground in isl.css. Used for theme-color and the pinned-tab mask.
  themeColor   = "#FDF2E6"

  # The post list and subscribe box on /writing/ appear when this is non-empty.
  substackURL  = "https://intseclab.substack.com/"

  # Landing-page hub cards. NOT CURRENTLY RENDERED — the landing page is the
  # hero plus one link (see layouts/home.html). Kept because these titles are
  # the page headings, and because design/landing-page-option-b.md plans to
  # bring a version of this back once there is content to put in it.
  [[params.hub]]
    label = "About"
    title = "What we are doing, and why"
    url   = "/about/"
    # Lead card: spans the hub row.
    feature = true
  [[params.hub]]
    label = "Our Work"
    title = "What we do and how"
    url   = "/work/"
  [[params.hub]]
    label = "Writing"
    title = "Publications and blog posts"
    url   = "/writing/"
  [[params.hub]]
    label = "People"
    title = "Meet our leadership"
    url   = "/team/"
  [[params.hub]]
    label = "Careers"
    title = "Open roles and applications"
    url   = "/careers/"

# Nav. Items whose page is a draft are skipped automatically in header.html,
# so Our Work and Writing stay listed here and reappear when they go live.
[menu]
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 10
  [[menu.main]]
    name   = "Our Work"
    url    = "/work/"
    weight = 20
  [[menu.main]]
    name   = "Writing"
    url    = "/writing/"
    weight = 30
  [[menu.main]]
    name   = "People"
    url    = "/team/"
    weight = 40
  [[menu.main]]
    name   = "Careers"
    url    = "/careers/"
    weight = 50
