# intseclab.org 301s here and stays the email domain. Split is intentional.
baseURL = "https://intelligencesecuritylaboratories.org/"
# `locale`, not `languageCode`: the latter was deprecated in Hugo v0.158.0 and
# emits a WARN, which the "site builds cleanly" check treats as a failure.
locale = "en-us"
title = "Intelligence Security Laboratories"
enableRobotsTXT = true
enableEmoji = false

# A brochure site has no tags or categories; without this Hugo publishes
# empty /tags/ and /categories/ pages.
disableKinds = ["taxonomy", "term"]

# ─────────────────────────────────────────────────────────────────────────
#  EDIT BELOW THIS LINE. Everything above is plumbing.
#  See README.md for a plain-English guide.
# ─────────────────────────────────────────────────────────────────────────
[params]
  headline     = "Building secure infrastructure for transformative AI"
  tagline      = "We are a nonprofit research lab focused on implementation-driven R&D for high-security AI systems. Our work bridges the gap between theoretical security requirements and practical deployments."
  contactEmail = "hello@intseclab.org"
  talentEmail  = "talent@intseclab.org"
  footerLine1  = "501(c)(3) Nonprofit Organization"
  footerLine2  = "EIN 39-2886672"

  ashbyOrg     = "Intelligence-Security-Laboratories"

  # Matches --ground in isl.css. Used for theme-color and the pinned-tab mask.
  themeColor   = "#FDF2E6"

  # The Blog link appears in the nav only when this is non-empty.
  # Leave "" until the Substack publication is live, then paste the URL here.
  substackURL  = ""

  # Landing-page hub cards. Order here is the order on the page.
  [[params.hub]]
    label = "About"
    title = "What we're doing, and why"
    blurb = "The problem, and why ISL exists."
    url   = "/about/"
    # Lead card: spans the hub row.
    feature = true
  [[params.hub]]
    label = "Our Work"
    title = "Current projects"
    blurb = "What we're building, and how."
    url   = "/work/"
  [[params.hub]]
    label = "Writing"
    title = "Publications & blog"
    blurb = "Research papers and blog posts."
    url   = "/writing/"
  [[params.hub]]
    label = "People"
    title = "Directors"
    blurb = "Who runs ISL."
    url   = "/team/"
  [[params.hub]]
    label = "Careers"
    title = "We are growing"
    blurb = "Open roles and applications."
    url   = "/careers/"

[menu]
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 10
  [[menu.main]]
    name   = "Our Work"
    url    = "/work/"
    weight = 20
  [[menu.main]]
    name   = "Writing"
    url    = "/writing/"
    weight = 30
  [[menu.main]]
    name   = "People"
    url    = "/team/"
    weight = 40
  [[menu.main]]
    name   = "Careers"
    url    = "/careers/"
    weight = 50
