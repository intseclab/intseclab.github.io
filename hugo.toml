# intseclab.org 301s here and stays the email domain. Split is intentional.
baseURL = "https://intelligencesecuritylaboratories.org/"
# `locale`, not `languageCode`: the latter was deprecated in Hugo v0.158.0 and
# emits a WARN, which the "site builds cleanly" check treats as a failure.
locale = "en-us"
title = "Intelligence Security Laboratories"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = false

# A four-page brochure site has no tags or categories; without this Hugo
# publishes empty /tags/ and /categories/ pages.
disableKinds = ["taxonomy", "term"]

# ─────────────────────────────────────────────────────────────────────────
#  EDIT BELOW THIS LINE. Everything above is plumbing.
#  See README.md for a plain-English guide.
# ─────────────────────────────────────────────────────────────────────────
[params]
  headline     = "Building secure infrastructure for transformative AI"
  tagline      = "We are a nonprofit research lab focused on implementation-driven R&D for high-security AI systems. Our work bridges the gap between theoretical security requirements and practical deployments."
  contactEmail = "hello@intseclab.org"
  footerLine1  = "501(c)(3) Nonprofit Organization"
  footerLine2  = "EIN 39-2886672"

  ashbyOrg     = "Intelligence-Security-Laboratories"

  # The Blog link appears in the nav and footer only when this is non-empty.
  # Leave it "" until the Substack publication is live, then paste the URL here.
  substackURL  = ""

  # ── Theme behaviour. Rarely changed. ──
  defaultTheme            = "light"
  disableThemeToggle      = true
  disableAnchoredHeadings = true
  ShowReadingTime         = false
  ShowShareButtons        = false
  ShowPostNavLinks        = false
  ShowBreadCrumbs         = false
  ShowCodeCopyButtons     = false
  ShowWordCount           = false
  disableScrollToTop      = true
  hidemeta                = true

  # Site-wide social card, relative to static/
  images = ["og-card.png"]

  [params.label]
    text = "Intelligence Security Laboratories"

  [params.assets]
    disableHLJS             = true
    favicon                 = "/favicon.ico"
    favicon16x16            = "/favicon-16x16.png"
    favicon32x32            = "/favicon-32x32.png"
    apple_touch_icon        = "/apple-touch-icon.png"
    safari_pinned_tab       = "/safari-pinned-tab.svg"
    # Both match --isl-bg; without them PaperMod emits a dark #2e2e33 default.
    theme_color             = "#FDF2E6"
    msapplication_TileColor = "#FDF2E6"

[menu]
  [[menu.main]]
    identifier = "team"
    name       = "Our Team"
    url        = "/team/"
    weight     = 10

  [[menu.main]]
    identifier = "careers"
    name       = "Careers"
    url        = "/careers/"
    weight     = 20
