name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # The Substack feed is read at build time, so the site rebuilds daily to pick
  # up new posts. Substack has no publish webhook, so this is a poll. Off-the-hour
  # minute because :00 is the busiest. GitHub delays scheduled runs under load —
  # use workflow_dispatch to publish immediately.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
