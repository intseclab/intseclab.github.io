{{/* Dev-only decision panel. hugo.IsServer is false in production, so it
     cannot ship. Delete this partial and its baseof call when done. */}}
{{- if hugo.IsServer }}
<style>
  /* Card surface: in light mode --raised == --ground, so cards are opaque fills
     in the page colour and punch holes in the grid. */
  body[data-cards="transparent"] .hub a,
  body[data-cards="transparent"] .card { background: transparent; }
  body[data-cards="lifted"] .hub a,
  body[data-cards="lifted"] .card { background: #FFFCF8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body[data-cards="lifted"] .hub a,
    :root:not([data-theme="light"]) body[data-cards="lifted"] .card { background: #2B2A25; }
  }
  :root[data-theme="dark"] body[data-cards="lifted"] .hub a,
  :root[data-theme="dark"] body[data-cards="lifted"] .card { background: #2B2A25; }

  #devpanel {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 100; width: 14rem;
    background: var(--ground); border: 1px solid var(--accent);
    padding: .75rem .8rem; font-family: var(--body); font-size: 11px;
    max-height: 92vh; overflow: auto;
  }
  #devpanel h4 {
    font-family: var(--body); font-size: 9px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
    margin: .8rem 0 .35rem; font-weight: 700;
  }
  #devpanel .r { display: flex; gap: 4px; flex-wrap: wrap; }
  #devpanel .s { display: flex; flex-direction: column; gap: 3px; }
  #devpanel button {
    font-family: var(--body); font-size: 10.5px; border: 1px solid var(--rule);
    background: transparent; color: var(--ink); padding: 3px 7px; cursor: pointer;
  }
  #devpanel button[aria-pressed="true"] {
    background: var(--accent); color: var(--ground); border-color: var(--accent);
  }
  #devpanel .out { color: var(--muted); font-variant-numeric: tabular-nums; }
  #devpanel hr { border: 0; border-top: 1px solid var(--rule); margin: .7rem 0; }
  #devpanel .why { color: var(--muted); line-height: 1.5; margin: .4rem 0 0; font-style: italic; }
  #dpHead {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    background: transparent; border: 0; padding: 0; cursor: pointer;
    font-family: var(--body); font-size: 8.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--accent);
  }
  #dpHead .chev { margin-left: auto; font-size: 10px; }
  #dpBody { margin-top: .6rem; }
  #devpanel[data-collapsed="true"] { width: auto; }
  #devpanel[data-collapsed="true"] #dpBody { display: none; }
  /* Shrinks rather than hides: display:none here made it vanish whenever the
     window was narrowed. */
  @media (max-width: 900px) {
    #devpanel { right: .5rem; bottom: .5rem; width: 12rem; }
    #devpanel button { font-size: 10px; padding: 2px 5px; }
  }
</style>

<div id="devpanel" data-collapsed="false">
  <button id="dpHead" aria-expanded="true" aria-controls="dpBody">
    <span>dev only · not in build</span>
    <span class="chev">▾</span>
  </button>

  <div id="dpBody">
    <h4>Card surface</h4>
    <div class="s" data-set="cards">
      <button data-v="ground" aria-pressed="true">Ground (holes in grid)</button>
      <button data-v="transparent" aria-pressed="false">Transparent</button>
      <button data-v="lifted" aria-pressed="false">Lifted tint</button>
    </div>

    <hr>
    <h4>Band line — <span class="out" id="dpB">10%</span></h4>
    <div class="r" data-set="bandline">
      <button data-v="0.06" aria-pressed="false">6%</button>
      <button data-v="0.10" aria-pressed="true">10%</button>
      <button data-v="0.16" aria-pressed="false">16%</button>
    </div>

    <h4>Grid module</h4>
    <div class="r" data-set="mod">
      <button data-v="24px" aria-pressed="false">24</button>
      <button data-v="32px" aria-pressed="true">32</button>
      <button data-v="40px" aria-pressed="false">40</button>
    </div>

    <hr>
    <div class="r"><button id="dpCopy">Copy settings</button></div>
    <p class="why" id="dpOut"></p>
  </div>
</div>

<script>
(function () {
  var root = document.documentElement;
  var st = { cards: 'ground', bandline: '0.10', mod: '32px' };

  try {
    var saved = JSON.parse(localStorage.getItem('isl-devpanel-state') || '{}');
    Object.keys(saved).forEach(function (k) { if (k in st) st[k] = saved[k]; });
  } catch (e) {}

  function apply() {
    document.querySelectorAll('#devpanel [data-set]').forEach(function (g) {
      var k = g.dataset.set;
      g.querySelectorAll('button').forEach(function (o) {
        o.setAttribute('aria-pressed', String(o.dataset.v === st[k]));
      });
    });
    document.body.setAttribute('data-cards', st.cards);
    root.style.setProperty('--band-line', 'rgba(253,242,230,' + st.bandline + ')');
    root.style.setProperty('--mod', st.mod);
    document.getElementById('dpB').textContent = Math.round(st.bandline * 100) + '%';
    try { localStorage.setItem('isl-devpanel-state', JSON.stringify(st)); } catch (e) {}
  }

  document.querySelectorAll('#devpanel [data-set]').forEach(function (g) {
    var key = g.dataset.set;
    g.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { st[key] = b.dataset.v; apply(); });
    });
  });

  var panel = document.getElementById('devpanel');
  var head = document.getElementById('dpHead');
  function setCollapsed(v) {
    panel.setAttribute('data-collapsed', String(v));
    head.setAttribute('aria-expanded', String(!v));
    head.querySelector('.chev').textContent = v ? '▸' : '▾';
    try { localStorage.setItem('isl-devpanel-collapsed', v ? '1' : '0'); } catch (e) {}
  }
  head.addEventListener('click', function () {
    setCollapsed(panel.getAttribute('data-collapsed') !== 'true');
  });
  try {
    if (localStorage.getItem('isl-devpanel-collapsed') === '1') setCollapsed(true);
  } catch (e) {}

  document.getElementById('dpCopy').addEventListener('click', function () {
    var txt = JSON.stringify(st);
    try { navigator.clipboard.writeText(txt); } catch (e) {}
    document.getElementById('dpOut').textContent = txt;
  });

  apply();
})();
</script>
{{- end }}
