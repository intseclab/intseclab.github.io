<footer class="site-footer">
  <div class="wrap">
    <p>{{ site.Params.footerLine1 }} &middot; {{ site.Params.footerLine2 }}</p>
  </div>
</footer>

<script>
  (function () {
    var btn = document.getElementById("themeBtn");
    var root = document.documentElement;
    function isDark() {
      var s = root.getAttribute("data-theme");
      if (s) return s === "dark";
      try { return matchMedia("(prefers-color-scheme: dark)").matches; }
      catch (e) { return false; }
    }
    function sync() { btn.textContent = isDark() ? "Light" : "Dark"; }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("isl-theme", next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
