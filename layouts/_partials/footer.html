{{/* div, not footer: .closing is the contentinfo landmark. */}}
<div class="site-footer">
  <div class="wrap">
    <p>{{ site.Params.footerLine1 }} &middot; {{ site.Params.footerLine2 }}</p>
  </div>
</div>

<script>
  (function () {
    var btn = document.getElementById("themeBtn");
    var root = document.documentElement;
    function isDark() {
      var s = root.getAttribute("data-theme");
      if (s) return s === "dark";
      try { return matchMedia("(prefers-color-scheme: dark)").matches; }
      catch (e) { return false; }
    }
    /* No visible label, so the accessible name carries the action and must
       track state. */
    function sync() {
      var label = isDark() ? "Switch to light theme" : "Switch to dark theme";
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label);
    }
    btn.addEventListener("click", function () {
      var next = isDark() ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("isl-theme", next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
