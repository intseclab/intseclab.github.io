{{ define "main" }}
<div class="wrap">
  <section class="hero">
    <h1>{{ site.Params.headline }}</h1>
    <p>{{ site.Params.tagline }}</p>
  </section>

  {{/* Hub cards. Each links to a real page — never an anchor. */}}
  <section style="border-bottom:0">
    <div class="hub">
      {{- range site.Params.hub }}
      <a href="{{ .url | relLangURL }}"{{ with .feature }} class="feature"{{ end }}>
        <span class="label">{{ .label }}</span>
        <h3>{{ .title }}</h3>
        <p>{{ .blurb }}</p>
      </a>
      {{- end }}
    </div>
  </section>
</div>
{{ end }}
